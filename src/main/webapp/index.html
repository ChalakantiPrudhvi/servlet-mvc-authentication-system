<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Registration Form</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
}

.container{
    background:white;
    padding:50px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.icon{
    font-size:70px;
    margin-bottom:15px;
}

h1{
    color:#333;
    margin-bottom:30px;
    font-size:35px;
}

.btn-container{
    display:flex;
    gap:20px;
    justify-content:center;
}

.btn{
    text-decoration:none;
    background:#007bff;
    color:white;
    padding:12px 30px;
    border-radius:8px;
    font-size:18px;
    font-weight:bold;
    transition:0.3s;
}

.btn:hover{
    background:#0056b3;
    transform:translateY(-3px);
}

.login{
    background:#28a745;
}

.login:hover{
    background:#218838;
}
</style>

</head>

<body>

<div class="container">

    <div class="icon">🎓</div>

    <h1>Welcome to My Registration Portal</h1>

    <div class="btn-container">
        <a href="signUp.jsp" class="btn">Sign Up</a>
        <a href="Login.jsp" class="btn login">Login</a>
    </div>

</div>

</body>
</html>
